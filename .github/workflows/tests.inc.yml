name: Tests

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    # Windows runners default to pwsh, which does not stop on a failing native command before the last line.
    shell: bash

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep the other jobs running, so a failure shows whether it is OS- or version-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e .

      - name: Test
        run: python -m unittest -v
